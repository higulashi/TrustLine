name: Import source package
on:
  push:
    paths:
      - TrustLine.zip
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract project
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path.cwd().resolve()
          with zipfile.ZipFile('TrustLine.zip') as archive:
              for entry in archive.infolist():
                  parts = Path(entry.filename).parts
                  assert parts[0] == 'TrustLine'
                  relative = Path(*parts[1:])
                  assert '.git' not in relative.parts
                  target = (root / relative).resolve()
                  assert target.is_relative_to(root)
                  # Workflow files are uploaded separately through the UI.
                  if relative.parts[:2] == ('.github', 'workflows'):
                      continue
                  if not entry.is_dir():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
          Path('TrustLine.zip').unlink()
          PY
      - name: Install simulation dependencies
        run: pip install 'numpy>=1.26,<3' 'Pillow>=10,<13'
      - name: Verify C core and simulation
        run: |
          python -m unittest discover -s tests -v
          python run_benchmark.py --quick --out build/smoke
      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete TrustLine source and verified experiments'
            git push origin HEAD:main
          fi
